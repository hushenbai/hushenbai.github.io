<!DOCTYPE html>
<html lang="en">
<head>

    <!-- 网页元信息 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Shenbai</title>

    <!-- 网页图标 -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/tcmbowl.png">
    <link rel="apple-touch-icon" href="/assets/tcmbowl.png">

    <!-- 网页样式 -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/artworkpage.css">
    <link rel="stylesheet" href="css/tcm-detail.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="js/translations.js"></script>
    <script src="js/exhibits-events.js"></script>
    <script src="js/script.js"></script>
    <script src="js/detail.js"></script>

</head>

<body>
    <!-- 1. 导航栏 -->
    <div class="nav-background">
        <nav class="nav-container">
            <div class="nav-left">
                <h4 class="nav-button" onclick="window.location.href='/'">
                    <span class="desktop-title" data-lang="site-title">SHENBAI</span>
                </h4>
            </div>
            <div class="nav-center">
                <h5 class="nav-button" onclick="window.location.href='/'">
                    <span class="desktop-title" data-lang="abm-title">胡申白</span>
                </h5>
                <h5 class="nav-button" onclick="window.location.href='works.html'">
                    <span class="desktop-title" data-lang="nav-works">作品</span>
                </h5>
            </div>
            <div class="nav-right">
                <div class="language-switch">
                    <h6><button onclick="toggleLanguage()" data-lang="switch-lang" style="all: unset; cursor: pointer;">English</button></h6>
                </div>
            </div>
        </nav>
    </div>

    <div class="mobile-menu">
        <div class="menu-container">
            <div class="mobile-menu-item" onclick="window.location.href='/'">
                <h6><span data-lang="abm-title">胡申白</span></h6>
            </div>
            <div class="mobile-menu-item" onclick="window.location.href='works.html'">
                <h6><span data-lang="nav-works">作品</span></h6>
            </div>
            <div class="mobile-menu-item">
                <h6><button type="button" class="mobile-lang-button" onclick="toggleLanguage()" data-lang="switch-lang">English</button></h6>
            </div>
        </div>
    </div>

    <div class="mobile-logo">
        <h4 onclick="window.location.href='/'">
            <span data-lang="site-title">SHENBAI</span>
        </h4>
    </div>

    <div class="artwork-toppart">
        <!-- 图片区域 -->
        <div class="artwork-imagebox">
            <div class="image-wrapper global-animation">               
                <div class="depthimg-container">
                    <img id="artwork-image" src="" alt="">
                    <!-- 深度层 -->
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                    <span class="depth-layer"></span>
                </div>
            </div>
        </div>
        <div class="nav-pages-mobile">
            <button class="nav-page-button-mobile prev-btn" aria-label="Previous artwork">
                <span data-lang="nav-prev">前一幅</span>
            </button>
            <button class="nav-page-button-mobile next-btn" aria-label="Next artwork">
                <span data-lang="nav-next">后一幅</span>
            </button>
        </div>
        <!-- 基本信息 -->
        <div class="artwork-info">
            <h1 id="detail-title" data-lang=""></h1>
            <div class="detail-info-grid">
                <p2 id="detail-serialnumber"></p2>
                <p2 id="detail-series" data-lang=""></p2>
                <p2 id="detail-media" data-lang=""></p2>
                <p2 id="detail-size"></p2>
                <p2 id="detail-weight"></p2>
                <p2 id="detail-year"></p2>
            </div>
        </div>
    </div>

    <main>
        
        <article class="article">
            <div class="article-line">
                <p0 id="detail-TCMmain" data-lang="detail-TCMmain"></p0>
            </div>
        </article>

        <!-- 展览列表 -->
        <div class="exhibits">
            <div id="exhibits-list" class="exhibits-list">
            <!-- 展览信息由 JavaScript 动态插入 -->
            </div>
        </div>

        <!-- 订阅按钮 -->
        <section class="group" id="group4">
            <div class="group-content">
                <h2 data-lang="tcm-group4" class="group-title">文言四字碗盛药图</h2>
            </div>
            <div class="container">
            <!-- JavaScript 将在这里插入第三组卡片 -->
            </div>
        </section>

        <div class="goback-container">
            <h5 class="nav-button" onclick="window.location.href='tcm.html'">
                <span class="desktop-title" data-lang="back" style="color:#8a8a8a">back</span>
                <span class="desktop-title" data-lang="listpage" style="color:#8a8a8a">listpage</span>
            </h5>
        </div>
            
    </main>

    <!-- 在 body 中添加 -->
    <div class="nav-pages">
        <button class="nav-page-button prev-btn" aria-label="Previous artwork">
            <img src="assets/leftar.svg" alt="Previous" class="nav-arrow">
        </button>
        <button class="nav-page-button next-btn" aria-label="Next artwork">
            <img src="assets/rightar.svg" alt="Next" class="nav-arrow">
        </button>
    </div>

    <footer>
        <p class="footer-meta">
            <span>&copy; 2024 HU SHENBAI</span>
            <a href="https://beian.miit.gov.cn/" rel="noopener noreferrer">蜀ICP备2026031565号</a>
        </p>
    </footer>  

    <script src="js/translations.js"></script>
    <script src="js/exhibits-events.js"></script>
    <script src="js/tcm-data-core.js"></script>
    <script src="js/tcm-catalog.js"></script>
    <script src="js/data.js"></script>
    <script src="js/animation3d.js"></script>
</body>
</html>
